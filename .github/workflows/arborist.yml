name: arborist

# A scheduled report on this repository, which is also how the action itself is
# tested: it runs the action from this checkout, built from source.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - action.yml
      - .github/workflows/arborist.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # arborist refuses a shallow clone
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ./
        id: arborist
        with:
          version: source
          # Two reports from one scan: the Markdown one lands in the job
          # summary, and both go into the artifact it links to.
          formats: markdown html
          args: --skip orphans # GITHUB_TOKEN cannot read the collaborator list
      - name: Show what was written
        env:
          FINDINGS: ${{ steps.arborist.outputs.findings }}
          FORMATS: ${{ steps.arborist.outputs.report-formats }}
          # Newline-separated, so it goes through the environment rather than
          # into the command line.
          REPORTS: ${{ steps.arborist.outputs.report-paths }}
        run: |
          echo "findings=$FINDINGS formats=$FORMATS"
          printf '%s\n' "$REPORTS"

